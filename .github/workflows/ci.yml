name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        # Run lint before tests so style failures fail fast — broken
        # imports or unused names should not wait for the test suite.
        run: python -m ruff check src/ tests/ benchmarks/

      - name: Run tests under coverage
        run: python -m coverage run -m unittest discover

      - name: Coverage report (fail under 85%)
        run: python -m coverage report --fail-under=85
