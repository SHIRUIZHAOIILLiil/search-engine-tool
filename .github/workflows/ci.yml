name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        # Run lint before tests so style failures fail fast — broken
        # imports or unused names should not wait for the test suite.
        run: python -m ruff check src/ tests/ benchmarks/ scripts/

      - name: Type check with mypy
        # Configuration lives in pyproject.toml [tool.mypy]; moderate
        # strictness — check_untyped_defs / warn_redundant_casts /
        # warn_unreachable — paired with the v1.7.0 Posting TypedDict
        # so the static surface is fully typed without --strict mode.
        run: python -m mypy

      - name: Verify API docs build (pdoc smoke)
        # Runs pdoc into a temp dir and discards the output — only
        # checks that every src/ docstring parses cleanly. Generated
        # HTML lives at docs/api/ locally (gitignored) for browsing.
        run: python scripts/build_api_docs.py --smoke

      - name: Run tests under coverage
        run: python -m coverage run -m unittest discover

      - name: Coverage report (fail under 85%)
        run: python -m coverage report --fail-under=85
